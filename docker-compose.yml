version: "3.9"

# Демонстрационная схема развёртывания:
#   client -> whoami-node-1 (FastAPI, хост :8001)
#   client -> whoami-node-2 (FastAPI, хост :8002)
#   (реверс-прокси в этом compose нет; при необходимости Apache ставится снаружи)
#   обе ноды приложения используют ОБЩИЙ внешний PostgreSQL для счётчиков/сессий.
#
# TLS в этом compose сознательно не настроен: сертификаты и SSL-терминация
# выполняются на уровне реверс-прокси (Apache).

services:
  postgres:
    image: postgres:16-alpine
    container_name: whoami-postgres
    restart: unless-stopped
    # Учётные данные только для лабораторного стенда; для общего окружения
    # задайте POSTGRES_PASSWORD снаружи (экспорт в shell или файл .env,
    # который читает сам docker compose для подстановки переменных).
    environment:
      POSTGRES_DB: whoami
      POSTGRES_USER: whoami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whoami}
    # Данные переживают перезапуск контейнера благодаря именованному volume.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoami -d whoami"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-net

  app1:
    build: .
    container_name: whoami-node-1
    restart: unless-stopped
    environment:
      NODE_NAME: node-1
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: whoami
      POSTGRES_USER: whoami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whoami}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend-net
    ports:
      - "8001:8000"

  app2:
    build: .
    container_name: whoami-node-2
    restart: unless-stopped
    environment:
      NODE_NAME: node-2
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: whoami
      POSTGRES_USER: whoami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whoami}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend-net
    ports:
      - "8002:8000"

networks:
  backend-net:
    driver: bridge

volumes:
  postgres-data:

