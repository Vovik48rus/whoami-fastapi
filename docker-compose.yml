version: "3.9"

# Демонстрационная схема для лабораторной работы №3:
#   client -> nginx (L7, round-robin, без TLS-логики в самом приложении)
#              -> whoami-node-1 (FastAPI)
#              -> whoami-node-2 (FastAPI)
#   обе ноды приложения используют ОБЩИЙ внешний Redis для счётчиков/сессий.
#
# TLS в этом compose сознательно не настроен — сертификаты и SSL-терминация
# добавляются позже поверх сервиса nginx в рамках лабораторной работы №3.

services:
  redis:
    image: redis:7-alpine
    container_name: whoami-redis
    restart: unless-stopped
    # AOF persistence — чтобы счётчики/сессии переживали перезапуск самого Redis.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-net

  app1:
    build: .
    container_name: whoami-node-1
    restart: unless-stopped
    environment:
      NODE_NAME: node-1
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend-net

  app2:
    build: .
    container_name: whoami-node-2
    restart: unless-stopped
    environment:
      NODE_NAME: node-2
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend-net

  nginx:
    image: nginx:1.27-alpine
    container_name: whoami-nginx
    restart: unless-stopped
    ports:
      - "8080:80"   # плоский HTTP; HTTPS/443 добавляется в лаб. работе №3
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

volumes:
  redis-data:
