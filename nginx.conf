# L7-балансировка для whoami-fastapi.
# Файл — готовая отправная точка для реального развёртывания. Для TLS
# добавьте слушатель 443 ssl с ssl_certificate/ssl_certificate_key —
# приложение об этом не знает и само HTTPS не терминирует.

upstream whoami_backend {
    # round-robin (по умолчанию) — можно заменить на least_conn / ip_hash при
    # необходимости L4-подобного поведения или sticky-сессий по IP клиента.
    server app1:8000 max_fails=3 fail_timeout=10s;
    server app2:8000 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://whoami_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Прокидываем реальные данные клиента и протокола на backend —
        # приложение отдаёт их обратно в /api для проверки корректности
        # настройки реверс-прокси.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;
    }

    # Точка для проверки живости самого Nginx / внешних healthcheck-систем.
    location = /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
